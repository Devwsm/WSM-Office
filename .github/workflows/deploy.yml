name: Deploy to cPanel (FTP)

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Batas total job. Kalau FTP menggantung, job dihentikan lebih cepat
    # supaya auto-retry (auto-retry-deploy.yml) bisa segera ambil runner baru.
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Install Composer dependencies (cek validitas composer.json, vendor gak diupload)
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-interaction

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & build frontend assets
        run: |
          npm ci
          npm run build

      # Catatan:
      # - Retry di dalam job yang sama dihapus: semua percobaan memakai runner
      #   (dan IP) yang sama, jadi kalau IP-nya diblokir firewall server,
      #   hasilnya pasti sama. Retry yang berguna = re-run di runner BARU,
      #   dikerjakan otomatis oleh auto-retry-deploy.yml.
      # - FTP-Deploy-Action memakai library basic-ftp yang SELALU passive
      #   (PASV/EPSV); tidak ada input "passive" yang bisa diatur.
      # - State file (.ftp-deploy-sync-state.json) di server membuat percobaan
      #   berikutnya hanya mengirim file yang belum terkirim.
      - name: Upload kode aplikasi ke ~/wsm-office
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}   # hostname/IP saja, TANPA :21
          port: 21
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          timeout: 60000                    # ms, default 30000
          local-dir: ./
          server-dir: ${{ secrets.FTP_APP_DIR }}/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/tests/**
            **/storage/**
            **/public/**
            **/vendor/**
            **/.env
            **/.env.example
            **/AGENTS.md
            **/CLAUDE.md
            **/README.md
            **/phpunit.xml
            **/package.json
            **/package-lock.json
            **/vite.config.js
            **/.editorconfig
            **/.npmrc

      - name: Upload hasil build ke public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          port: 21
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          timeout: 60000
          local-dir: ./public/build/
          server-dir: ${{ secrets.FTP_PUBLIC_DIR }}/build/

      - name: Trigger migrate & cache lewat deploy-hook
        run: |
          curl -sf "https://${{ secrets.APP_URL }}/deploy-hook.php?token=${{ secrets.DEPLOY_TOKEN }}"