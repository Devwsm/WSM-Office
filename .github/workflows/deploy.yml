name: Deploy to cPanel (SSH)

# Deploy otomatis lewat SSH + arsip tar (menggantikan FTP; server tidak punya rsync).
# Cadangan: workflow "Deploy to cPanel (FTP, cadangan manual)" di deploy-ftp.yml.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Satu deploy dalam satu waktu; deploy yang menunggu tidak dibatalkan.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_DIR: ${{ secrets.SSH_APP_DIR }}
      PUBLIC_DIR: ${{ secrets.SSH_PUBLIC_DIR }}
      PHP_BIN: ${{ secrets.SSH_PHP_BIN || 'php' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cek secret SSH lengkap
        env:
          S_HOST: ${{ secrets.SSH_HOST }}
          S_PORT: ${{ secrets.SSH_PORT }}
          S_USER: ${{ secrets.SSH_USER }}
          S_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          S_KNOWN: ${{ secrets.SSH_KNOWN_HOSTS }}
          S_URL: ${{ secrets.APP_URL }}
        run: |
          missing=""
          [ -z "$S_HOST" ] && missing="$missing SSH_HOST"
          [ -z "$S_PORT" ] && missing="$missing SSH_PORT"
          [ -z "$S_USER" ] && missing="$missing SSH_USER"
          [ -z "$S_KEY" ] && missing="$missing SSH_PRIVATE_KEY"
          [ -z "$S_KNOWN" ] && missing="$missing SSH_KNOWN_HOSTS"
          [ -z "$APP_DIR" ] && missing="$missing SSH_APP_DIR"
          [ -z "$PUBLIC_DIR" ] && missing="$missing SSH_PUBLIC_DIR"
          [ -z "$S_URL" ] && missing="$missing APP_URL"
          if [ -n "$missing" ]; then
            echo "::error::Secret belum diisi:$missing"
            exit 1
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      # vendor dibangun di runner (tanpa paket dev) lalu dikirim ke server,
      # jadi tidak perlu lagi upload vendor manual.
      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-interaction

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & build frontend assets
        run: |
          npm ci
          npm run build

      - name: Siapkan koneksi SSH
        env:
          S_HOST: ${{ secrets.SSH_HOST }}
          S_PORT: ${{ secrets.SSH_PORT }}
          S_USER: ${{ secrets.SSH_USER }}
          S_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          S_KNOWN: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$S_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$S_KNOWN" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CONF
          Host wsm
            HostName $S_HOST
            Port $S_PORT
            User $S_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            ConnectTimeout 20
            ServerAliveInterval 15
            ServerAliveCountMax 4
          CONF
          chmod 600 ~/.ssh/config

      - name: Tes koneksi SSH (3x percobaan)
        run: |
          for i in 1 2 3; do
            if ssh wsm "echo 'SSH OK di' \$(hostname); $PHP_BIN -v | head -1; test -d '$APP_DIR' && echo 'Folder aplikasi ada' || { echo 'Folder aplikasi TIDAK ADA: $APP_DIR'; exit 3; }; command -v tar >/dev/null && command -v gzip >/dev/null && echo 'tar + gzip tersedia' || { echo 'tar/gzip TIDAK ADA di server'; exit 4; }"; then
              exit 0
            fi
            echo "Percobaan $i gagal, tunggu 15 detik..."
            sleep 15
          done
          echo "::error::Tidak bisa SSH ke server. Cek SSH_HOST, SSH_PORT, SSH_USER, SSH_PRIVATE_KEY, SSH_KNOWN_HOSTS, dan apakah key sudah Authorized di cPanel."
          exit 1

      # Server tidak punya rsync, jadi kode dikirim sebagai arsip tar.gz lewat SSH
      # (hanya butuh tar + gzip di server). Arsip diekstrak ke folder sementara,
      # lalu folder kode ditukar (folder lama disimpan sebagai *.old sampai deploy berikutnya).
      # .env, storage, dan bootstrap/cache tidak pernah disentuh.
      # vendor hanya dikirim kalau composer.lock berubah (penanda di server: .vendor-lock-hash).
      - name: Kirim kode aplikasi ke server
        run: |
          set -euo pipefail

          LOCK_HASH=$(sha256sum composer.lock | cut -d' ' -f1)
          REMOTE_HASH=$(ssh wsm "cat '$APP_DIR/.vendor-lock-hash' 2>/dev/null || true")
          DIRS="app config database resources routes"
          SEND_HASH=""
          if [ "$LOCK_HASH" = "$REMOTE_HASH" ] && ssh wsm "test -d '$APP_DIR/vendor'"; then
            echo "composer.lock tidak berubah: vendor tidak dikirim ulang"
          else
            echo "composer.lock baru/berubah: vendor ikut dikirim"
            DIRS="$DIRS vendor"
            SEND_HASH="$LOCK_HASH"
          fi

          tar -czf /tmp/release.tar.gz --exclude='*.sqlite' --exclude='bootstrap/cache' \
            $DIRS bootstrap artisan composer.json composer.lock
          ls -lh /tmp/release.tar.gz

          ssh wsm "set -e; cd '$APP_DIR'; rm -rf .deploy-new; mkdir .deploy-new; tar -xzf - -C .deploy-new" < /tmp/release.tar.gz

          ssh wsm "bash -s -- '$APP_DIR' '$DIRS' '$SEND_HASH'" <<'REMOTE'
          set -e
          APP="$1"; DIRS="$2"; HASH="$3"
          cd "$APP"
          for d in $DIRS; do
            rm -rf "$d.old"
            if [ -d "$d" ]; then mv "$d" "$d.old"; fi
            mv ".deploy-new/$d" "$d"
          done
          if ls database.old/*.sqlite >/dev/null 2>&1; then cp -a database.old/*.sqlite database/; fi
          cp -a .deploy-new/bootstrap/. bootstrap/
          cp -f .deploy-new/artisan .deploy-new/composer.json .deploy-new/composer.lock .
          if [ -n "$HASH" ]; then echo "$HASH" > .vendor-lock-hash; fi
          rm -rf .deploy-new
          echo "Kode aplikasi terpasang"
          REMOTE

      - name: Kirim hasil build ke public_html
        run: |
          set -euo pipefail
          tar -czf /tmp/build.tar.gz -C public build
          ssh wsm "set -e; cd '$PUBLIC_DIR'; rm -rf .build-new; mkdir .build-new; tar -xzf - -C .build-new" < /tmp/build.tar.gz
          ssh wsm "set -e; cd '$PUBLIC_DIR'; rm -rf build.old; if [ -d build ]; then mv build build.old; fi; mv .build-new/build build; rm -rf .build-new build.old; echo 'Build terpasang'"

      - name: Migrate & cache di server
        run: |
          ssh wsm "set -e
            cd '$APP_DIR'
            rm -f bootstrap/cache/packages.php bootstrap/cache/services.php
            $PHP_BIN artisan package:discover --ansi
            $PHP_BIN artisan migrate --force
            $PHP_BIN artisan config:cache
            $PHP_BIN artisan route:cache
            $PHP_BIN artisan view:cache
            echo 'DEPLOY SELESAI'"

      - name: Cek situs hidup
        env:
          S_URL: ${{ secrets.APP_URL }}
        run: |
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors --max-time 20 -o /dev/null "https://$S_URL/up"
          echo "Situs merespons OK"