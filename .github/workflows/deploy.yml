name: Deploy to cPanel (FTP)

# Jalan di self-hosted runner (laptop Windows di Indonesia), bukan runner
# GitHub: IP runner GitHub tidak bisa menjangkau port 21 Rumahweb sejak
# 4 Okt 2026 (5 percobaan ulang di VM berbeda tetap timeout). Kalau jalur
# itu sudah pulih, kembalikan `runs-on` ke ubuntu-latest dan step
# deploy-hook ke `curl` biasa.

on:
  push:
    branches: [main]

# Satu deploy dalam satu waktu; kalau ada beberapa push beruntun, hanya yang
# terbaru yang dijalankan setelah yang sedang berjalan selesai.
concurrency:
  group: deploy-wsm-office
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, windows]
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Install Composer dependencies (cek validitas composer.json, vendor gak diupload)
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-interaction

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies frontend
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Upload kode aplikasi ke ~/wsm-office (percobaan 1)
        id: upload-app-1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./
          server-dir: ${{ secrets.FTP_APP_DIR }}/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/tests/**
            **/storage/**
            **/public/**
            **/vendor/**
            **/.env
            **/.env.example
            **/AGENTS.md
            **/CLAUDE.md
            **/README.md
            **/phpunit.xml
            **/package.json
            **/package-lock.json
            **/vite.config.js
            **/.editorconfig
            **/.npmrc

      # "Error: Timeout (control socket)" adalah bug flaky yang sudah lama dikenal
      # di SamKirkland/FTP-Deploy-Action (lihat README 5.8 no. 1), gagal dalam
      # hitungan detik lalu sukses kalau diulang. Retry otomatis di sini
      # menggantikan re-run manual.
      - name: Upload kode aplikasi ke ~/wsm-office (retry jika percobaan 1 gagal)
        if: steps.upload-app-1.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./
          server-dir: ${{ secrets.FTP_APP_DIR }}/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/tests/**
            **/storage/**
            **/public/**
            **/vendor/**
            **/.env
            **/.env.example
            **/AGENTS.md
            **/CLAUDE.md
            **/README.md
            **/phpunit.xml
            **/package.json
            **/package-lock.json
            **/vite.config.js
            **/.editorconfig
            **/.npmrc

      - name: Upload hasil build ke public_html (percobaan 1)
        id: upload-build-1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./public/build/
          server-dir: ${{ secrets.FTP_PUBLIC_DIR }}/build/

      - name: Upload hasil build ke public_html (retry jika percobaan 1 gagal)
        if: steps.upload-build-1.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./public/build/
          server-dir: ${{ secrets.FTP_PUBLIC_DIR }}/build/

      - name: Trigger migrate & cache lewat deploy-hook
        # curl.exe (bukan `curl`): di PowerShell `curl` adalah alias
        # Invoke-WebRequest. --ssl-no-revoke menghindari error cek
        # revocation Schannel di Windows; verifikasi sertifikat tetap aktif.
        run: curl.exe -sSf --ssl-no-revoke "https://${{ secrets.APP_URL }}/deploy-hook.php?token=${{ secrets.DEPLOY_TOKEN }}"