name: Deploy to cPanel (FTP)

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Info koneksi (IP runner & server FTP)
        continue-on-error: true
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
        run: |
          # Secret selalu disensor jadi *** di log. Supaya IP server tetap terbaca
          # untuk perbandingan, titiknya diberi spasi (hanya alamat server, bukan password).
          sp() { echo "$1" | sed 's/\./ . /g'; }

          RUNNER_IP=$(curl -s --max-time 10 https://api.ipify.org || echo "gagal")
          RESOLVED=$(getent ahostsv4 "$FTP_HOST" | awk '{print $1}' | sort -u | tr '\n' ' ')
          [ -z "$RESOLVED" ] && RESOLVED="DNS GAGAL (cek isi secret FTP_HOST)"

          if timeout 8 bash -c "</dev/tcp/$FTP_HOST/21" 2>/dev/null; then
            PORT21="terbuka"
          else
            PORT21="TIDAK merespons"
          fi

          echo "IP runner (pengirim)  : $RUNNER_IP"
          echo "FTP host (isi secret) : $(sp "$FTP_HOST")"
          echo "IP penerima (resolve) : $(sp "$RESOLVED")"
          echo "Port 21 dari runner   : $PORT21"

          {
            echo "### Info koneksi deploy"
            echo "- IP runner (pengirim): \`$RUNNER_IP\`"
            echo "- FTP host (isi secret): \`$(sp "$FTP_HOST")\`"
            echo "- IP penerima (resolve): \`$(sp "$RESOLVED")\`"
            echo "- Port 21 dari runner: **$PORT21**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-interaction

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & build frontend assets
        run: |
          npm ci
          npm run build

      - name: Upload kode aplikasi ke ~/wsm-office (percobaan 1)
        id: upload-app-1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          timeout: 120000
          log-level: verbose
          local-dir: ./
          server-dir: ${{ secrets.FTP_APP_DIR }}/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/tests/**
            **/storage/**
            public/**
            **/vendor/**
            **/.env
            **/.env.example
            **/AGENTS.md
            **/CLAUDE.md
            **/README.md
            **/phpunit.xml
            **/package.json
            **/package-lock.json
            **/vite.config.js
            **/.editorconfig
            **/.npmrc

      - name: Tunggu sebelum retry aplikasi
        if: steps.upload-app-1.outcome == 'failure'
        run: sleep 20

      - name: Upload kode aplikasi ke ~/wsm-office (retry)
        if: steps.upload-app-1.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          timeout: 120000
          log-level: verbose
          local-dir: ./
          server-dir: ${{ secrets.FTP_APP_DIR }}/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/tests/**
            **/storage/**
            public/**
            **/vendor/**
            **/.env
            **/.env.example
            **/AGENTS.md
            **/CLAUDE.md
            **/README.md
            **/phpunit.xml
            **/package.json
            **/package-lock.json
            **/vite.config.js
            **/.editorconfig
            **/.npmrc

      - name: Upload hasil build ke public_html (percobaan 1)
        id: upload-build-1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          timeout: 120000
          log-level: verbose
          local-dir: ./public/build/
          server-dir: ${{ secrets.FTP_PUBLIC_DIR }}/build/

      - name: Tunggu sebelum retry build
        if: steps.upload-build-1.outcome == 'failure'
        run: sleep 20

      - name: Upload hasil build ke public_html (retry)
        if: steps.upload-build-1.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          timeout: 120000
          log-level: verbose
          local-dir: ./public/build/
          server-dir: ${{ secrets.FTP_PUBLIC_DIR }}/build/

      - name: Trigger migrate & cache lewat deploy-hook
        run: |
          curl -sf "https://${{ secrets.APP_URL }}/deploy-hook.php?token=${{ secrets.DEPLOY_TOKEN }}"