name: Auto retry deploy

# Kalau deploy gagal di step upload FTP (IP runner GitHub kena blokir
# sementara oleh Rumahweb), jalankan ulang di VM runner baru yang IP-nya
# biasanya berbeda. Retry di dalam satu job tidak membantu karena IP-nya
# sama; yang membantu adalah re-run (VM baru), sama seperti klik
# "Re-run all jobs" manual.
on:
  workflow_run:
    workflows: ["Deploy to cPanel (FTP)"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  retry:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_SHA: ${{ github.event.workflow_run.head_sha }}
      MAX_RETRY: "4"
    steps:
      - name: Cek penyebab gagal
        id: cause
        run: |
          FAILED=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --jq '.jobs[].steps[] | select(.conclusion=="failure") | .name')
          echo "Step gagal: $FAILED"
          if echo "$FAILED" | grep -q '^Upload'; then
            echo "retry=true" >> "$GITHUB_OUTPUT"
          else
            echo "retry=false" >> "$GITHUB_OUTPUT"
            echo "Bukan gagal upload FTP, tidak diulang otomatis."
          fi

      - name: Ulangi deploy di runner baru
        if: steps.cause.outputs.retry == 'true'
        run: |
          for i in $(seq 1 "$MAX_RETRY"); do
            sleep 120

            # Jangan menimpa deploy yang lebih baru dengan commit lama.
            LATEST=$(gh api "repos/$REPO/commits/main" --jq .sha)
            if [ "$LATEST" != "$RUN_SHA" ]; then
              echo "Sudah ada commit lebih baru di main; run ini tidak diulang."
              exit 0
            fi

            BEFORE=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .run_attempt)
            echo "Ulang ke-$i (setelah attempt $BEFORE)"
            gh run rerun "$RUN_ID" --failed --repo "$REPO"

            while true; do
              sleep 15
              INFO=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '[.status,.run_attempt,.conclusion]|@tsv')
              STATUS=$(echo "$INFO" | cut -f1)
              ATTEMPT=$(echo "$INFO" | cut -f2)
              CONCL=$(echo "$INFO" | cut -f3)
              if [ "$ATTEMPT" -gt "$BEFORE" ] && [ "$STATUS" = "completed" ]; then break; fi
            done

            if [ "$CONCL" = "success" ]; then
              echo "Deploy berhasil pada ulang ke-$i"
              exit 0
            fi
            echo "Ulang ke-$i gagal ($CONCL)"
          done
          echo "Semua percobaan ulang gagal"
          exit 1