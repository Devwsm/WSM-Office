name: Auto-retry deploy

# Kalau "Deploy to cPanel (FTP)" gagal (mis. Timeout control socket karena IP
# runner diblokir firewall), jalankan ulang otomatis. Setiap attempt baru
# mendapat runner/IP baru. Dibatasi maksimal 5 attempt.
#
# Harus workflow terpisah: sebuah run tidak bisa me-rerun dirinya sendiri
# selama masih berjalan.

on:
  workflow_run:
    workflows: ["Deploy to cPanel (FTP)"]
    types: [completed]

permissions:
  actions: write

jobs:
  retry:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 5
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Jeda singkat lalu re-run job yang gagal
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          echo "Attempt ke-${{ github.event.workflow_run.run_attempt }} gagal, mencoba lagi..."
          sleep 30
          gh run rerun "$RUN_ID" --failed